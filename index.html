<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reporte de Incidentes Técnicos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="bg-light">
  <div class="container mt-5">
    <h1 class="text-center text-primary mb-4">🔧 Reporte de Incidentes</h1>
    <p class="text-center text-secondary">Sistema de registro técnico de fallos</p>

    <!-- Formulario -->
    <!-- Ahora apunta a incidentes.php -->
    <form action="incidentes.php" method="post" class="p-4 bg-white shadow rounded">
      <div class="mb-3">
        <label for="nombre" class="form-label">Nombre del Reportante <span class="text-danger">*</span></label>
        <input type="text" id="nombre" name="nombre" required class="form-control">
      </div>

      <div class="mb-3">
        <label for="email" class="form-label">Email de Contacto <span class="text-danger">*</span></label>
        <input type="email" id="email" name="email" required class="form-control">
      </div>

      <div class="mb-3">
        <label for="tipo_incidente" class="form-label">Tipo de Incidente <span class="text-danger">*</span></label>
        <select id="tipo_incidente" name="tipo_incidente" required class="form-select">
          <option value="">Seleccione una opción</option>
          <option value="hardware">Fallo de Hardware</option>
          <option value="software">Error de Software</option>
          <option value="red">Problema de Red</option>
          <option value="seguridad">Incidente de Seguridad</option>
          <option value="otro">Otro</option>
        </select>
      </div>

      <div class="mb-3">
        <label for="prioridad" class="form-label">Prioridad <span class="text-danger">*</span></label>
        <select id="prioridad" name="prioridad" required class="form-select">
          <option value="">Seleccione prioridad</option>
          <option value="baja">Baja</option>
          <option value="media">Media</option>
          <option value="alta">Alta</option>
          <option value="critica">Crítica</option>
        </select>
      </div>

      <div class="mb-3">
        <label for="descripcion" class="form-label">Descripción del Incidente <span class="text-danger">*</span></label>
        <textarea id="descripcion" name="descripcion" required class="form-control" placeholder="Describa detalladamente el problema..."></textarea>
      </div>

      <div class="mb-3">
        <label for="ubicacion" class="form-label">Ubicación / Departamento</label>
        <input type="text" id="ubicacion" name="ubicacion" class="form-control" placeholder="Ej: Oficina 201, Sistemas">
      </div>

      <div class="text-center">
        <button type="submit" class="btn btn-primary">📤 Enviar Reporte</button>
      </div>
    </form>

    <!-- Enlace corregido para ver reportes -->
    <div class="text-center mt-3">
      <a href="incidentes.php" class="text-primary fw-bold">📋 Ver todos los reportes</a>
    </div>
  </div>
</body>
</html>
